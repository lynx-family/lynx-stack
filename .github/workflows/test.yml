name: Test
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  merge_group:
    types: [checks_requested]
permissions:
  repository-projects: read
  contents: read
  statuses: read

env:
  CI: 1
  TURBO_TELEMETRY_DISABLED: 1
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  benchmark:
    needs: build
    uses: ./.github/workflows/workflow-bench.yml
    secrets:
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENDPOINT: ${{ secrets.ENDPOINT }}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      REGION: ${{ secrets.REGION }}
  build:
    name: Build (Ubuntu)
    uses: ./.github/workflows/workflow-build.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      runs-on: lynx-ubuntu-26.04-xlarge
      runs-on-name: Ubuntu
  build-windows:
    name: Build (Windows)
    uses: ./.github/workflows/workflow-build.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      runs-on: lynx-windows-2022-large
      runs-on-name: Windows
  bundle-analysis:
    needs: build
    uses: ./.github/workflows/workflow-bundle-analysis.yml
  code-style-check:
    runs-on: lynx-ubuntu-26.04-medium
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # We need full history for changeset status check
          fetch-depth: 0
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/pnpm-install
        with:
          node-version: "24"
          save-if: ${{ github.ref_name == 'main' }}
      - name: Code Style Check
        run: |
          pnpm dprint check
          pnpm biome check
      - name: Package Metadata Check
        run: pnpm --package=@pnpm/meta-updater@2.0.6 dlx meta-updater --test
      - name: Preact Dedupe Check
        run: node .github/scripts/check-single-preact-instance.cjs
      - name: API Check
        run: pnpm turbo api-extractor
      - name: Changeset Check
        run: pnpm changeset status --since=origin/main --output .changeset-status.json
      - name: Changeset Script Tests
        run: node --test .github/scripts/*.test.cjs
      - name: Major Bump Check
        run: node .github/scripts/check-no-major-changeset.cjs .changeset-status.json
      - name: Peer Dependency Range Check
        run: node .github/scripts/check-peer-dependency-ranges.cjs .changeset-status.json
      - name: Changeset Heading Check
        run: node .github/scripts/check-no-heading-changeset.cjs .changeset-status.json
      - name: Dependency Changeset Check
        run: node .github/scripts/check-dep-changes-have-changeset.cjs .changeset-status.json

  eslint:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    permissions: {}
    with:
      runs-on: lynx-ubuntu-26.04-medium
      run: pnpm eslint . --flag v10_config_lookup_from_file

  sherif:
    runs-on: lynx-ubuntu-26.04-medium
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Enable Corepack
        run: | # zizmor: ignore[adhoc-packages] corepack must be installed globally outside of a lockfile
          npm install -g corepack@0.35.0
          corepack enable
      - name: Lockfile Check
        run: |
          pnpm dedupe --check --lockfile-only
          pnpm peers check --lockfile-only
      - name: Sherif Check
        run: |
          pnpm dlx sherif@latest -i tailwindcss

  lighthouse:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    permissions:
      statuses: write
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
    with:
      runs-on: lynx-custom-container
      is-web: true
      run: |
        echo "open files limit before: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
        ulimit -Sn "$(ulimit -Hn)"
        echo "open files limit after: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
        export NODE_OPTIONS="--max-old-space-size=32768"
        pnpm --filter @lynx-js/web-core-e2e run lh || echo "Lighthouse failed"
  playwright-web-elements:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: Playwright Web Elements Test (${{ matrix.shard }}/2)
    with:
      runs-on: lynx-custom-container
      is-web: true
      codecov-flags: "e2e"
      web-report-path: "packages/web-platform/web-elements/playwright-report"
      run: |
        echo "open files limit before: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
        ulimit -Sn "$(ulimit -Hn)"
        echo "open files limit after: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
        export NODE_OPTIONS="--max-old-space-size=32768"
        export PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-report.junit.xml
        pnpm --filter @lynx-js/web-elements run test --reporter='github,dot,junit,html' --shard=${{ matrix.shard }}/2
        pnpm --filter @lynx-js/web-elements run coverage:ci
  web-core-e2e:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    name: Playwright ${{ matrix.render }} (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        render: [CSR]
        shard: [1, 2]
    with:
      runs-on: lynx-custom-container
      is-web: true
      web-report-name: "playwright-${{ matrix.render }}-shard${{ matrix.shard }}"
      web-report-path: "packages/web-platform/web-core-e2e/playwright-report"
      codecov-flags: "e2e"
      run: |
        if [ "${{ matrix.render }}" = "SSR" ]; then
          export ENABLE_SSR=true
        fi
        echo "open files limit before: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
        ulimit -Sn "$(ulimit -Hn)"
        echo "open files limit after: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
        export NODE_OPTIONS="--max-old-space-size=32768"
        export PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-report.junit.xml
        pnpm --filter @lynx-js/web-core-e2e run test --reporter='github,dot,junit,html' --shard=${{ matrix.shard }}/2
        pnpm --filter @lynx-js/web-core-e2e run coverage:ci
  test-api:
    needs: build
    uses: ./.github/workflows/workflow-test.yml

    with:
      runs-on: lynx-ubuntu-26.04-medium
      run: |
        pnpm turbo api-extractor -- --local
        if test "$(git diff -- './packages/**/*.api.md' --name-only | wc -l)" -gt 0 ; then
          echo "::error::API Report Changes Detected"
          echo "The following API reports have changed:"
          git diff -- './packages/**/*.api.md' --name-only
          echo "::error::Please run 'turbo api-extractor -- --local' to update them."
          echo ""
          exit 1;
        fi
        git add --intent-to-add .
        if test "$(git diff -- './packages/**/*.api.md' --name-only | wc -l)" -gt 0 ; then
          echo "::error::API Report Changes Detected"
          echo "The following API reports have changed:"
          git diff -- './packages/**/*.api.md' --name-only
          echo "::error::Please run 'turbo api-extractor -- --local' to update them."
          echo ""
          exit 1;
        fi
  test-publish:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    with:
      runs-on: lynx-ubuntu-26.04-medium
      run: |
        # Generated smoke-test projects do not carry a packageManager pin, so
        # keep this stage on pnpm 10 even when Corepack's registry default moves.
        corepack prepare pnpm@10.29.3 --activate
        pnpm dlx @pnpm/registry-mock@4 prepare
        pnpm dlx @pnpm/registry-mock@4 &
        printf '\n//localhost:4873/:_authToken="this-is-a-fake-token"\n' >> ~/.npmrc
        pnpm changeset status --since=origin/main --output "$RUNNER_TEMP/changeset-status.json"
        if jq -e '.releases | length > 0' "$RUNNER_TEMP/changeset-status.json" > /dev/null; then
          pnpm changeset version --snapshot regression
        fi
        node packages/tools/canary-release/snapshot.js
        pnpm --recursive publish --no-git-checks --access public --registry=http://localhost:4873

        # `npm run <script> <args>` swallows the args unless they follow `--`,
        # while Yarn 4 would forward the `--` itself to the script.
        run_script() {
          local pm=$1 script=$2
          shift 2
          if [ "$pm" = npm ] && [ $# -gt 0 ]; then
            npm run "$script" -- "$@"
          else
            "$pm" run "$script" "$@"
          fi
        }

        install_with() {
          case $1 in
            pnpm) pnpm install --registry=http://localhost:4873 ;;
            npm) npm install --registry=http://localhost:4873 ;;
            yarn)
              corepack prepare yarn@4.18.0 --activate
              # Marks the generated app as a standalone project so Yarn does not
              # try to attach it to any package.json above the temp directory.
              touch yarn.lock
              yarn config set nodeLinker node-modules
              yarn config set npmRegistryServer http://localhost:4873
              yarn config set unsafeHttpWhitelist --json '["localhost"]'
              # The projects are generated fresh, so there is no lockfile to be
              # immutable about -- but Yarn turns that on whenever CI is set.
              yarn config set enableImmutableInstalls false
              # Yarn quarantines any version published less than `1d` ago, but
              # the canary versions reached the mock registry seconds earlier.
              yarn config set npmMinimalAgeGate 0
              # Hardened mode turns itself on for public pull requests and
              # validates resolutions against the registry, which the throwaway
              # project generated here has nothing to gain from.
              yarn config set enableHardenedMode false
              yarn install
              ;;
          esac
        }

        # Each package manager lays `node_modules` out differently, so they do
        # not agree on which undeclared transitive dependency a package can
        # still resolve. Smoke-test all of them to catch phantom dependencies.
        smoke_test() {
          local pm=$1 tools=$2 dir=$3
          shift 3
          cd `mktemp -d`
          npx --registry http://localhost:4873 create-rspeedy-canary@latest --template react --dir "$dir" --tools "$tools" "$@"
          cd "$dir"
          npx --registry http://localhost:4873 upgrade-rspeedy-canary@latest
          install_with "$pm"
          local bin=${pm%%-*}
          run_script "$bin" build
          run_script "$bin" build --mode development
          run_script "$bin" lint
        }

        smoke_test pnpm eslint create-rspeedy-regression --skill lynx-devtool
        smoke_test pnpm eslint,vitest-rltl create-rspeedy-regression-vitest-rltl
        run_script pnpm test
        smoke_test pnpm eslint,rstest-rltl create-rspeedy-regression-rstest-rltl
        run_script pnpm test
        smoke_test npm eslint create-rspeedy-regression-npm --skill lynx-devtool
        smoke_test yarn eslint create-rspeedy-regression-yarn --skill lynx-devtool
  test-react:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      runs-on: lynx-ubuntu-26.04-medium
      run: >
        pnpm
        --filter @lynx-js/react-runtime
        --filter @lynx-js/react-transform
        run test
        --reporter=github-actions
        --reporter=dot
        --reporter=junit
        --outputFile=test-report.junit.xml
        --coverage.reporter='json'
        --coverage.reporter='text'
        --testTimeout=50000
        --no-cache
        --logHeapUsage
        --silent
  test-rust:
    needs: build
    uses: ./.github/workflows/rust.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
      MIDSCENE_OPENAI_INIT_CONFIG_JSON: ${{ secrets.MIDSCENE_OPENAI_INIT_CONFIG_JSON }}
  test-type:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      runs-on: lynx-ubuntu-26.04-medium
      run: pnpm -r run test:type
  test-rstest:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      runs-on: lynx-ubuntu-26.04-medium
      run: >
        pnpm exec rstest run
        -c rstest.config.ts
        --coverage
        --testTimeout=50000
        --hookTimeout=50000
  test-rstest-windows:
    needs: build-windows
    uses: ./.github/workflows/workflow-test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      runs-on: lynx-windows-2022-large
      run: >
        pnpm exec rstest run
        -c rstest.config.ts
        --coverage
        --testTimeout=50000
        --hookTimeout=50000
  kitten-lynx-android-emulator:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    name: Kitten Lynx Android Emulator Test
    with:
      runs-on: lynx-ubuntu-26.04-physical-medium
      run: |
        # 4. Start Emulator
        echo "Starting emulator..."
        ${ANDROID_HOME}/emulator/emulator -avd Nexus_5_API_28 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &

        # 5. Wait for boot
        echo "Waiting for emulator to boot..."
        adb wait-for-device
        BOOT_TIMEOUT=60
        BOOT_ELAPSED=0
        while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            if [ $BOOT_ELAPSED -ge $BOOT_TIMEOUT ]; then
              echo "Error: Emulator failed to boot within ${BOOT_TIMEOUT} seconds!"
              exit 1
            fi
            sleep 2
            BOOT_ELAPSED=$((BOOT_ELAPSED+2))
        done
        echo "Emulator is ready."

        # 6. Install Lynx Explorer
        wget -q https://github.com/lynx-family/lynx/releases/download/3.6.0/LynxExplorer-noasan-release.apk -O LynxExplorer.apk
        adb install -r LynxExplorer.apk

        # 7. Start Lynx Explorer and verify
        echo "Starting Lynx Explorer..."
        if ! adb shell pm list packages | grep -q com.lynx.explorer; then
          echo "Error: com.lynx.explorer is not installed!"
          exit 1
        fi
        adb shell monkey -p com.lynx.explorer -c android.intent.category.LAUNCHER 1

        echo "Waiting for Lynx Explorer to start..."
        MAX_RETRIES=10
        RETRY_COUNT=0
        while ! adb shell pidof com.lynx.explorer > /dev/null; do
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "Error: com.lynx.explorer failed to start!"
            exit 1
          fi
          echo "Waiting... ($RETRY_COUNT/$MAX_RETRIES)"
          sleep 2
          RETRY_COUNT=$((RETRY_COUNT+1))
        done
        echo "Lynx Explorer is running."

        # 8. Run Kitten Lynx's Android tests.
        pnpm --filter @lynx-js/kitten-lynx-test-infra run test --coverage --reporter=github-actions --reporter=dot --reporter=junit --outputFile=test-report.junit.xml --coverage.reporter='json' --coverage.reporter='text' --testTimeout=50000 --no-cache --logHeapUsage --silent

  test-typos:
    runs-on: lynx-ubuntu-26.04-medium
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          files: .
  test-vitest:
    needs: build
    uses: ./.github/workflows/workflow-test.yml
    name: Vitest (Ubuntu)
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      runs-on: lynx-ubuntu-26.04-medium
      run: >
        pnpm run test
        --reporter=github-actions
        --reporter=dot
        --reporter=junit
        --outputFile=test-report.junit.xml
        --expect.poll.timeout=5000
        --testTimeout=50000
        --hookTimeout=50000
        --coverage
        --coverage.reporter='json'
        --coverage.reporter='text'
        --no-cache
        --logHeapUsage
        --silent
  test-vitest-windows:
    needs: build-windows
    uses: ./.github/workflows/workflow-test.yml
    name: Vitest (Windows)
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      runs-on: lynx-windows-2022-large
      run: >
        pnpm run test
        --reporter=github-actions
        --reporter=dot
        --reporter=junit
        --outputFile=test-report.junit.xml
        --expect.poll.timeout=5000
        --testTimeout=50000
        --hookTimeout=50000
        --coverage
        --coverage.reporter='json'
        --coverage.reporter='text'
        --no-cache
        --logHeapUsage
        --silent
  website:
    needs: build
    uses: ./.github/workflows/workflow-website.yml
  done:
    needs:
      - benchmark
      - code-style-check
      - eslint
      # - playwright-linux
      - playwright-web-elements
      - sherif
      - test-api
      - test-publish
      - test-react
      - test-rust
      - test-type
      - test-rstest
      - test-rstest-windows
      - test-typos
      - test-vitest
      - test-vitest-windows
      - web-core-e2e
      - website
    if: always()
    runs-on: ubuntu-26.04
    name: Done
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
