name: Bundle Analysis

on:
  workflow_call:

permissions: {}

env:
  CI: 1
  TURBO_TELEMETRY_DISABLED: 1
jobs:
  build:
    runs-on: lynx-ubuntu-26.04-medium
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - path: ./examples/react
            name: example-react
          - path: ./examples/react-element-template
            name: example-react-element-template
          - path: ./examples/react-main-thread-function
            name: example-react-main-thread-function
          - path: ./examples/react-externals
            name: example-react-externals
          - path: ./packages/web-platform/web-explorer
            name: web-explorer
          - path: ./packages/rspeedy/core
            name: rspeedy
    name: Build ${{ matrix.project.name }}
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: TurboCache
        uses: lynx-infra/cache@5c6160a6a4c7fca80a2f3057bb9dfc9513fcb732
        with:
          path: .turbo
          # We have to be strict here to make sure getting the cache of build-all
          key: turbo-v4-${{ runner.os }}-${{ hashFiles('packages/**/src/**/*.rs') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Install
        uses: ./.github/actions/pnpm-install
        with:
          node-version: "24"
          save-if: ${{ github.ref_name == 'main' }}
      - name: Build
        run: |
          pnpm turbo build --summarize
      - name: Build ${{ matrix.project.name }}
        env:
          RSPEEDY_BUNDLE_ANALYSIS: 1
        run: |
          pnpm --filter ${{ matrix.project.path }} run build
      - name: Prepare RelativeCI artifact
        env:
          WEBPACK_STATS_FILE: ${{ matrix.project.path }}/dist/stats.json
        run: |
          mkdir -p "$RUNNER_TEMP/relative-ci-artifacts"
          cp "$WEBPACK_STATS_FILE" "$RUNNER_TEMP/relative-ci-artifacts/webpack-stats.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.project.name }}-relative-ci-artifacts
          path: ${{ runner.temp }}/relative-ci-artifacts
          retention-days: 90
          if-no-files-found: error
