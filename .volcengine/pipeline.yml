# 全流程只有一个 task，不需要注册自定义步骤。
# 替换两处镜像仓库地址，并保留控制台配置的用户名密码 loginCredential。
# 在流水线变量中将 CR_USERNAME、CR_PASSWORD 设为环境变量，密码设为隐私变量。
# 使用「通用 Webhook 触发」，运行时变量留空，POST {}；不绑定代码源。
version: 2.0.0
agentPool: public/prod-v2-public

stages:
  - stage: build-and-push
    displayName: 构建并推送 Lynx Stack 镜像
    tasks:
      - task: workspace-image
        displayName: 构建并上传 commit 镜像
        timeout: 2h
        resourcesPolicy: none
        resources:
          limits:
            cpu: 8C
            memory: 16Gi
        steps:
          - step: checkout
            displayName: 克隆 main 并保存 HEAD
            component: exec@1.0.0
            inputs:
              shell: BASH
              cmd: |
                set -e
                cd "$(CP_WORKSPACE)"
                git clone --depth=1 --single-branch --branch main https://github.com/lynx-family/lynx-stack.git source
                git -C source rev-parse HEAD > main.commit
          - step: buildkit-custom
            displayName: BuildKit 构建并上传
            component: buildkit-custom@3.0.0
            inputs:
              customImageAddress:
                protocol: https
                address: REPLACE_WITH_CR_HOST/REPLACE_WITH_CR_NAMESPACE/REPLACE_WITH_CR_REPOSITORY:build-$(PIPELINERUN_ID)
              # 在控制台添加用户名密码凭据，替换此空列表。
              loginCredential: []
              contextPath: ./source
              dockerfiles:
                default:
                  path: ./source/Dockerfile
              buildParams: --target runtime --build-arg UBUNTU_MIRROR=http://mirrors.volces.com/ubuntu
              compression: gzip
              disableSSLVerify: false
              useCache: true
          - step: tag-commit
            displayName: 添加 commit SHA 标签
            component: custom-image@2.0.0
            inputs:
              image: docker.io/regclient/regctl:v0.11.6-alpine
              cmd: |
                set +x
                set -e
                cd "$(CP_WORKSPACE)"
                image_repo='REPLACE_WITH_CR_HOST/REPLACE_WITH_CR_NAMESPACE/REPLACE_WITH_CR_REPOSITORY'
                export REGCTL_CONFIG="$(CP_WORKSPACE)/regctl.json"
                printf '%s' "$CR_PASSWORD" | regctl registry login "${image_repo%%/*}" --user "$CR_USERNAME" --pass-stdin
                image_ref="$image_repo:$(cat main.commit)"
                regctl image copy "$image_repo:build-$(PIPELINERUN_ID)" "$image_ref"
                regctl tag delete "$image_repo:build-$(PIPELINERUN_ID)"
                echo "Published image: $image_ref"
          - step: cleanup
            displayName: 清理源码和临时文件
            component: exec@1.0.0
            inputs:
              shell: BASH
              cmd: |
                set -e
                cd "$(CP_WORKSPACE)"
                rm -rf -- source main.commit regctl.json
