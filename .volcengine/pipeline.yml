# 先注册同目录 main-head.yml 中的自定义步骤，再导入本流水线。
# 替换镜像仓库地址，并保留控制台配置的用户名密码 loginCredential。
# 使用「通用 Webhook 触发」，运行时变量留空，POST {}；不绑定代码源。
version: 2.0.0
agentPool: public/prod-v2-public

stages:
  - stage: build-and-push
    displayName: 构建并推送 Lynx Stack 镜像
    tasks:
      - task: resolve-main
        displayName: 获取 main 最新提交
        timeout: 10m
        resourcesPolicy: none
        resources:
          limits:
            cpu: 1C
            memory: 2Gi
        steps:
          - step: main-head
            component: custom@1.0.0/lynx-main-head@1.0.0
            inputs: {}
        outputs:
          - commitSha_main-head
      - task: workspace-image
        displayName: 构建并上传 commit 镜像
        dependsOn:
          - resolve-main
        timeout: 2h
        resourcesPolicy: none
        resources:
          limits:
            cpu: 8C
            memory: 16Gi
        steps:
          - step: checkout
            displayName: 拉取 main 对应的提交
            component: exec@1.0.0
            inputs:
              shell: BASH
              cmd: |
                set -e
                cd "$(CP_WORKSPACE)"
                git init source
                git -C source remote add origin https://github.com/lynx-family/lynx-stack.git
                git -C source fetch --depth=1 origin '$(stages.build-and-push.tasks.resolve-main.outputs.commitSha_main-head)'
                git -C source checkout --detach FETCH_HEAD
          - step: buildkit-custom
            displayName: BuildKit 构建并以 commit SHA 上传
            component: buildkit-custom@3.0.0
            inputs:
              customImageAddress:
                protocol: https
                address: REPLACE_WITH_CR_HOST/REPLACE_WITH_CR_NAMESPACE/REPLACE_WITH_CR_REPOSITORY:$(stages.build-and-push.tasks.resolve-main.outputs.commitSha_main-head)
              # 在控制台添加用户名密码凭据，替换此空列表。
              loginCredential: []
              contextPath: ./source
              dockerfiles:
                default:
                  path: ./source/Dockerfile
              buildParams: --target runtime --build-arg UBUNTU_MIRROR=http://mirrors.volces.com/ubuntu
              compression: gzip
              disableSSLVerify: false
              useCache: true
          - step: cleanup
            displayName: 清理源码
            component: exec@1.0.0
            inputs:
              shell: BASH
              cmd: |
                set -e
                cd "$(CP_WORKSPACE)"
                rm -rf -- source
        outputs:
          - imageOutput_buildkit-custom
