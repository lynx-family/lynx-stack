# 在火山 CP「模板市场 > 步骤模板 > 创建自定义步骤」中注册本文件。
# 注册后的组件标识为 custom@1.0.0/lynx-main-head@1.0.0。
step: lynx-main-head
version: 1.0.0
displayName: 获取 Lynx Stack main SHA
category: Command
image: docker.io/library/buildpack-deps:bookworm-scm
outputs:
  - name: commitSha
    displayName: Commit SHA
    type: string
script: |
  bash -e -o pipefail <<'BASH'
  git ls-remote https://github.com/lynx-family/lynx-stack.git refs/heads/main \
    | cut -f1 | tr -d '\n' > "/tekton/results/commitSha_${CP_STEP_NAME}"
  BASH
