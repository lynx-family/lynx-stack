[package]
name = "swc_plugin_background_only"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
swc_core = { workspace = true, features = ["ecma_ast", "ecma_parser", "ecma_utils", "ecma_visit", "testing_transform"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(swc_ast_unknown)"] }
