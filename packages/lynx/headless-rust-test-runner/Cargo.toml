[package]
name = "lynx-headless-rust-test-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lynx = { path = "../engine-bridge/lynx" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = "3.27.0"
thiserror = "2.0.20"
ureq = "2.12.1"
url = "2.5.8"

[build-dependencies]
fs2 = "0.4.3"
hex = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
sha2 = { workspace = true }
tempfile = "3.27.0"

[dev-dependencies]
static_assertions = "1.1.0"

[[bin]]
name = "lynx-headless-rust-test-runner"
path = "src/main.rs"
