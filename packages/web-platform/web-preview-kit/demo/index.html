<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Lynx web preview demo host</title>
    <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 13px/1.4 system-ui, sans-serif;
      display: grid;
      grid-template-columns: 180px 1fr 380px;
      grid-template-rows: auto 1fr 200px;
      height: 100vh;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid #ccc;
    }

    #files {
      overflow: auto;
      border-right: 1px solid #ccc;
      margin: 0;
      padding: 4px 0;
      list-style: none;
    }

    #files li {
      padding: 2px 8px;
      cursor: pointer;
    }

    #files li.active {
      background: #def;
    }

    #editor {
      width: 100%;
      height: 100%;
      border: 0;
      resize: none;
      font: 12px/1.4 ui-monospace, monospace;
      padding: 8px;
    }

    #preview {
      width: 100%;
      height: 100%;
      border: 0;
      border-left: 1px solid #ccc;
    }

    #status {
      font-weight: 600;
    }

    #status.failed {
      color: #b00;
    }

    footer {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid #ccc;
      min-height: 0;
    }

    #diagnostics, #log {
      margin: 0;
      overflow: auto;
      padding: 6px 8px;
      font: 11px/1.4 ui-monospace, monospace;
      white-space: pre-wrap;
    }

    #diagnostics {
      color: #b00;
      border-right: 1px solid #ccc;
    }
    </style>
  </head>
  <body>
    <header>
      <label>Card <select id="card"></select></label>
      <button id="apply" type="button">Apply edit</button>
      <label><input id="auto-apply" type="checkbox" checked> apply as I
        type</label>
      <button id="reload" type="button">Reload card</button>
      <span id="status">connecting…</span>
    </header>
    <ul id="files"></ul>
    <textarea id="editor" spellcheck="false"></textarea>
    <iframe
      id="preview"
      title="Lynx preview"
      allow="cross-origin-isolated"
    ></iframe>
    <footer>
      <pre id="diagnostics"></pre>
      <pre id="log"></pre>
    </footer>
  </body>
</html>
