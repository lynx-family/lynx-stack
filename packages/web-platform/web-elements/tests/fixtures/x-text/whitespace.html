<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Native text whitespace</title>
    <link href="/main.css" rel="stylesheet">
    <style>
    .probe {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 240px;
    }
    .probe-text {
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 24px;
      white-space: normal;
    }
    </style>
  </head>
  <body>
    <script src="/main.js" defer></script>
    <script>
    window.addEventListener('load', () => {
        const samples = [
          ['reference', 'M'],
          ['space', ' '],
          ['spaces', '  '],
          ['two-lines', ' \n '],
          ['nbsp', '\u00a0'],
        ];
        for (const backend of ['raw-text', 'direct-text', 'attribute']) {
          for (const [name, value] of samples) {
            const container = document.createElement('x-view');
            container.className = 'probe';
            container.dataset.backend = backend;
            container.dataset.sample = name;
            for (const content of ['Before', value, 'After']) {
              const text = document.createElement('x-text');
              text.className = 'probe-text';
              if (backend === 'raw-text') {
                const raw = document.createElement('raw-text');
                raw.setAttribute('text', content);
                text.append(raw);
              } else if (backend === 'attribute') {
                text.setAttribute('text', content);
              } else {
                text.append(document.createTextNode(content));
              }
              container.append(text);
            }
            document.body.append(container);
          }
        }
      });
    </script>
  </body>
</html>
