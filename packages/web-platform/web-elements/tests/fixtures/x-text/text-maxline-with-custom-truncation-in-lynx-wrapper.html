<html>
  <head>
    <meta charset="utf-8">
    <title>web playground</title>
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="default" name="apple-mobile-web-app-status-bar-style">
    <meta content="telephone=no" name="format-detection">
    <meta content="portrait" name="screen-orientation">
    <meta
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
      name="viewport"
    >
    <meta content="portrait" name="x5-orientation" />
    <link
      href="/main.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <script src="/main.js" defer></script>
    <style>
    .text {
      width: 300px;
      font-size: 16px;
      line-height: 24px;
      word-break: break-all;
      margin-bottom: 20px;
    }
    inline-truncation {
      color: aqua;
    }
    .icon {
      width: 14px;
      height: 14px;
      margin-left: 4px;
      background-color: aqua;
    }
    </style>

    <!-- A conditionally rendered inline-truncation is mounted inside a lynx-wrapper by ReactLynx. -->
    <x-text id="long" class="text" text-maxline="2"><inline-text>hello world,
        this is a long enough text to be truncated at the second line, so the
        custom truncation should be shown at the end of
        it.</inline-text><lynx-wrapper><inline-truncation><inline-text>... See
            more</inline-text><x-view
            class="icon"
          ></x-view></inline-truncation></lynx-wrapper></x-text>

    <x-text id="short" class="text" text-maxline="2"><inline-text>short text
        fits.</inline-text><lynx-wrapper><inline-truncation><inline-text>... See
            more</inline-text><x-view
            class="icon"
          ></x-view></inline-truncation></lynx-wrapper></x-text>

    <x-text id="maxline-1" class="text" text-maxline="1"><inline-text>hello
        world, this is a long enough text to be truncated at the first
        line.</inline-text><lynx-wrapper><inline-truncation><inline-text>... See
            more</inline-text><x-view
            class="icon"
          ></x-view></inline-truncation></lynx-wrapper></x-text>
  </body>
</html>
