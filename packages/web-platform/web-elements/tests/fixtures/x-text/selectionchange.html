<html>
  <head>
    <meta charset="utf-8">
    <title>x-text selectionchange</title>
    <link href="/main.css" rel="stylesheet" />
  </head>
  <body>
    <script src="/main.js" defer></script>
    <x-text id="text" text-selection="true"><raw-text
        text="before"
      ></raw-text><inline-text id="inline-text"><raw-text
          text="inline"
        ></raw-text></inline-text><raw-text text="after"></raw-text></x-text>
  </body>
</html>
