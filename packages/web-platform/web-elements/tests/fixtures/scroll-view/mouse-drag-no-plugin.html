<html>
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
      name="viewport"
    >
    <link href="/no-plugin.css" rel="stylesheet">
    <style>
    scroll-view {
      height: 140px;
      width: 180px;
    }

    scroll-view > div {
      flex: none;
      height: 500px;
      width: 100%;
    }
    </style>
  </head>
  <body>
    <script src="/no-plugin.js" defer></script>
    <scroll-view id="without-plugin" scroll-orientation="vertical">
      <div>native desktop scrolling</div>
    </scroll-view>
  </body>
</html>
