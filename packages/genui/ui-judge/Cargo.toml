[package]
name = "ui_judge"
version = "0.1.0"
autobins = false
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Headless Lynx screenshots and deterministic image comparison"

[lib]
crate-type = ["rlib"]

[features]
default = []
server = [
  "dep:async-trait",
  "dep:axum",
  "dep:chrono",
  "dep:hmac",
  "dep:sha2",
  "dep:socket2",
  "dep:tempfile",
  "dep:uuid",
  "dep:ve-tos-rust-sdk",
  "dep:zip",
  "tokio/io-util",
  "tokio/net",
  "tokio/process",
  "tokio/rt-multi-thread",
  "tokio/signal",
]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
axum = { version = "0.8.9", optional = true, features = ["multipart"] }
base64 = "0.23.0"
chrono = { version = "0.4.45", optional = true, default-features = false, features = ["clock"] }
hmac = { version = "0.12.1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["bmp"] }
lynx-headless-rust-test-runner = { path = "../../lynx/headless-rust-test-runner" }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { version = "0.10.9", optional = true }
socket2 = { version = "0.6.5", optional = true }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.19"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.24.0", optional = true, features = ["v4"] }
ve-tos-rust-sdk = { version = "2.9.20", optional = true, features = ["tokio-runtime"] }
zip = { version = "9.2.0", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
crc64fast = "1.1.0"

[build-dependencies]
fs2 = "0.4.3"
hex = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
sha2 = { workspace = true }
tempfile = "3.27.0"

[[bin]]
name = "ui-judge-server"
path = "src/main.rs"
required-features = ["server"]
