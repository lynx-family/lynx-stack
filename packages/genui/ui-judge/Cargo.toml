[package]
name = "ui_judge"
version = "0.1.0"
autobins = false
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Headless Lynx UI evaluation and VLM scoring"

[lib]
crate-type = ["rlib"]

[features]
default = []
server = [
  "dep:axum",
  "dep:http-body-util",
  "dep:socket2",
  "dep:tempfile",
  "dep:zip",
  "tokio/net",
  "tokio/process",
  "tokio/rt-multi-thread",
  "tokio/signal",
]

[dependencies]
agent-sdk = { version = "0.18.0", default-features = false }
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", optional = true, features = ["multipart"] }
base64 = "0.23.1"
http-body-util = { version = "0.1.5", optional = true }
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
lynx-headless-rust-test-runner = { path = "../../lynx/headless-rust-test-runner" }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
socket2 = { version = "0.6.5", optional = true }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.20"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
zip = { version = "8.6.0", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
fs2 = "0.4.3"
hex = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
sha2 = { workspace = true }
tempfile = "3.27.0"

[[bin]]
name = "ui-judge-server"
path = "src/main.rs"
required-features = ["server"]
